name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm run test:markdown && npm run test:deadlines && npm run test:theme:unit && npm run test:reports:unit && npm run test:review:unit && npm run test:formula:unit
        working-directory: frontend
      - run: python3 -m unittest discover -s scripts -p 'local_tools_test.py'
      - run: mkdir -p backend/src/main/resources/static && cp -R frontend/dist/. backend/src/main/resources/static/
      - run: bash mvnw -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: course-community-app
          path: backend/target/course-community-0.1.0.jar
