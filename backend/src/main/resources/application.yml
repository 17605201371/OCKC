server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  # 公网带宽有限，文本类资源压缩后体积约为原来的三分之一。
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/community;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  seed: ${DEMO_SEED:false}
  seed-password: ${DEMO_PASSWORD:}
  ai:
    base: ${AI_API_BASE:https://api.stepfun.com/step_plan/v1}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:step-3.7-flash}
logging:
  level:
    root: INFO
server.error.include-message: never
